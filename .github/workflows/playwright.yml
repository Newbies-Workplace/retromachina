name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    # Playwright 1.58 cannot install browsers on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04

    services:
      mariadb:
        image: mariadb:10.7
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: retro
          MYSQL_DATABASE: retro
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v6.2.0
      with:
        node-version-file: .nvmrc

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: cd apps/web && npx playwright install --with-deps chromium

    # Test users and their sessions are created by e2e/auth.setup.ts, so no
    # Google auth state or seeded users are needed.
    - name: Prepare test variables
      run: echo "$DOTENV" > .env
      shell: bash
      env:
        DOTENV: ${{ secrets.DOTENV }}

    - name: Build the app
      run: npm run build

    - name: Run migrations
      run: npm run migrate:deploy --workspace=api

    - name: Run Playwright tests
      run: npm test --workspace=web

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: | 
          apps/web/playwright-report/
          apps/web/test-results/
        retention-days: 1
